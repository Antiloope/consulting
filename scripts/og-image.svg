<!--
  Fuente del og:image (assets/img/og.png, 1200×630). Regenerar con
  `bash scripts/gen-images.sh` tras editar.

  El canvas es CUADRADO (1200×1200), no 1200×630: `qlmanage` (el rasterizador
  que usa el script) reescala un SVG no cuadrado con un factor que no es 1:1
  ni documentado. Con un canvas cuadrado renderiza a escala exacta 1:1, así
  que el diseño real vive centrado en la banda de 630px (y de 285 a 915) y
  gen-images.sh recorta esa banda del cuadrado resultante. No cambiar a un
  viewBox de 1200×630 sin volver a resolver ese problema.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <rect width="1200" height="1200" fill="#0f0f0f"/>

  <text font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="64" font-weight="700" letter-spacing="-1.5" fill="#fcfcfc">
    <tspan x="80" y="505">Consultoría de tecnología</tspan>
    <tspan x="80" y="581">para PyMEs con</tspan>
    <tspan x="80" y="657">software <tspan fill="#4d9bf0">crítico</tspan></tspan>
  </text>

  <text x="80" y="729" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="400" fill="#a5a5a5">
    Crecer adaptando el software a la velocidad del negocio.
  </text>

  <text x="80" y="817" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="600" fill="#fcfcfc">
    <tspan fill="#4d9bf0">/</tspan> Rodrigo Pizarro
  </text>
  <text x="80" y="857" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="400" fill="#a5a5a5">
    Para devolverte el control del negocio
  </text>
</svg>
